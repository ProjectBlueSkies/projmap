<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="qfill" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#2563eb" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="hglow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="256" height="256" rx="40"/></clipPath>
  </defs>

  <rect width="256" height="256" rx="40" fill="url(#bg)"/>

  <!-- subtle background grid -->
  <g clip-path="url(#clip)" stroke="#6666cc" stroke-width="0.5" opacity="0.07">
    <line x1="0" y1="64" x2="256" y2="64"/>
    <line x1="0" y1="128" x2="256" y2="128"/>
    <line x1="0" y1="192" x2="256" y2="192"/>
    <line x1="64" y1="0" x2="64" y2="256"/>
    <line x1="128" y1="0" x2="128" y2="256"/>
    <line x1="192" y1="0" x2="192" y2="256"/>
  </g>

  <!-- quad fill -->
  <polygon points="85,58 171,58 210,198 46,198" fill="url(#qfill)"/>

  <!-- inner mapping lines -->
  <g stroke="#a78bfa" stroke-width="1" opacity="0.22">
    <line x1="85" y1="58" x2="210" y2="198"/>
    <line x1="171" y1="58" x2="46" y2="198"/>
    <line x1="128" y1="58" x2="128" y2="198"/>
    <line x1="66" y1="128" x2="190" y2="128"/>
  </g>

  <!-- quad glow outline -->
  <polygon points="85,58 171,58 210,198 46,198" fill="none" stroke="#7c3aed" stroke-width="4" filter="url(#glow)" opacity="0.55"/>
  <!-- quad crisp outline -->
  <polygon points="85,58 171,58 210,198 46,198" fill="none" stroke="#a78bfa" stroke-width="2"/>

  <!-- corner handles -->
  <rect x="77" y="50" width="16" height="16" rx="4" fill="#8b5cf6" filter="url(#hglow)"/>
  <rect x="163" y="50" width="16" height="16" rx="4" fill="#8b5cf6" filter="url(#hglow)"/>
  <rect x="202" y="190" width="16" height="16" rx="4" fill="#8b5cf6" filter="url(#hglow)"/>
  <rect x="38" y="190" width="16" height="16" rx="4" fill="#8b5cf6" filter="url(#hglow)"/>
</svg>
