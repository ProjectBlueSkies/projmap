[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "projmap"
version = "0.1.0"
description = "Linux-native projection mapping tool"
requires-python = ">=3.11"
dependencies = [
    "moderngl>=5.10",
    "PySide6>=6.7",
    "numpy>=1.26",
    "Pillow>=10.0",
    "opencv-python>=4.8",
]

[project.scripts]
projmap = "projmap.main:main"
